name: CI
on:
  pull_request:
    types:
      - closed
    branches:
      - main
  push:
    branches:
      - '**'
  workflow_dispatch:
  
jobs:
  build-swiftpm:
    name: Build SwiftPM
    uses: oversizedev/GithubWorkflows/.github/workflows/build-swiftpm.yml@main
    strategy:
      matrix:
        destination:
          - generic/platform=iOS Simulator
          - generic/platform=watchOS Simulator
          - generic/platform=tvOS Simulator
          - platform=macOS,arch=arm64
    with:
      package: OversizeUI
      destination: ${{ matrix.destination }}
    secrets: inherit
    
  build-iOS-example:
    name: Build iOS example
    needs: build-swiftpm
    uses: oversizedev/GithubWorkflows/.github/workflows/build-app.yml@main
    with:
      path: Example/Example
      scheme: Example (iOS)
      destination: generic/platform=iOS Simulator
    secrets: inherit
    
  build-macOS-example:
    name: Build macOS examples
    needs: build-swiftpm
    uses: oversizedev/GithubWorkflows/.github/workflows/build-app.yml@main
    with:
      path: Example/Example
      scheme: Example (macOS)
      destination: platform=macOS,arch=arm64
    secrets: inherit
    
  build-tvOS-example:
    name: Build tvOS examples
    needs: build-swiftpm
    uses: oversizedev/GithubWorkflows/.github/workflows/build-app.yml@main
    with:
      path: Example/Example
      scheme: Example (tvOS)
      destination: generic/platform=tvOS Simulator
    secrets: inherit
    
  build-watchOS-example:
    name: Build watchOS examples
    needs: build-swiftpm
    uses: oversizedev/GithubWorkflows/.github/workflows/build-app.yml@main
    with:
      path: Example/Example
      scheme: Example (watchOS)
      destination: generic/platform=watchOS Simulator
    secrets: inherit

  test-iOS-example:
    name: Test iOS example
    needs: build-iOS-example
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select the newest available iPhone simulator
        id: simulator
        run: |
          set -eo pipefail
          udid=$(xcrun simctl list devices available --json | jq -r '
            .devices
            | to_entries
            | map(select(.key | test("com.apple.CoreSimulator.SimRuntime.iOS")))
            | sort_by(.key)
            | reverse
            | map(.value | map(select(.name | test("iPhone"))))
            | flatten
            | .[0].udid // empty
          ')
          if [ -z "$udid" ]; then
            echo "No iPhone simulator available on this runner" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid"

      - name: Run package and UI tests
        run: |
          set -eo pipefail
          xcodebuild \
            -project Example/Example.xcodeproj \
            -scheme "Example (iOS)" \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath TestResults \
            test \
            -retry-tests-on-failure \
            -test-iterations 3 \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 3

  bump:
    name: Bump version
    if: github.ref == 'refs/heads/main'
    needs:
      - build-swiftpm
      - build-iOS-example
      - build-macOS-example
      - build-tvOS-example
      - build-watchOS-example
      - test-iOS-example
    uses: oversizedev/GithubWorkflows/.github/workflows/bump.yml@main
    secrets: inherit
