name: CI
on:
  pull_request:
    types:
      - closed
    branches:
      - main
  push:
    branches:
      - '**'
  workflow_dispatch:
  
jobs:
  build-swiftpm:
    name: Build SwiftPM
    uses: oversizedev/GithubWorkflows/.github/workflows/build-swiftpm.yml@main
    strategy:
      matrix:
        destination:
          - generic/platform=iOS Simulator
          - generic/platform=watchOS Simulator
          - generic/platform=tvOS Simulator
          - platform=macOS,arch=arm64
    with:
      package: OversizeUI
      destination: ${{ matrix.destination }}
    secrets: inherit
    
  build-iOS-example:
    name: Build iOS example
    needs: build-swiftpm
    uses: oversizedev/GithubWorkflows/.github/workflows/build-app.yml@main
    with:
      path: Example/Example
      scheme: Example (iOS)
      destination: generic/platform=iOS Simulator
    secrets: inherit
    
  build-macOS-example:
    name: Build macOS examples
    needs: build-swiftpm
    uses: oversizedev/GithubWorkflows/.github/workflows/build-app.yml@main
    with:
      path: Example/Example
      scheme: Example (macOS)
      destination: platform=macOS,arch=arm64
    secrets: inherit
    
  build-tvOS-example:
    name: Build tvOS examples
    needs: build-swiftpm
    uses: oversizedev/GithubWorkflows/.github/workflows/build-app.yml@main
    with:
      path: Example/Example
      scheme: Example (tvOS)
      destination: generic/platform=tvOS Simulator
    secrets: inherit
    
  build-watchOS-example:
    name: Build watchOS examples
    needs: build-swiftpm
    uses: oversizedev/GithubWorkflows/.github/workflows/build-app.yml@main
    with:
      path: Example/Example
      scheme: Example (watchOS)
      destination: generic/platform=watchOS Simulator
    secrets: inherit

  test-iOS-example:
    name: Test iOS example
    needs: build-iOS-example
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run package and UI tests
        run: |
          set -eo pipefail
          xcodebuild \
            -project Example/Example.xcodeproj \
            -scheme "Example (iOS)" \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro" \
            -resultBundlePath TestResults \
            test \
            -retry-tests-on-failure \
            -test-iterations 3 \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 3

  bump:
    name: Bump version
    if: github.ref == 'refs/heads/main'
    needs:
      - build-swiftpm
      - build-iOS-example
      - build-macOS-example
      - build-tvOS-example
      - build-watchOS-example
      - test-iOS-example

    uses: oversizedev/GithubWorkflows/.github/workflows/bump.yml@main
    secrets: inherit
